# LlaveCorp — sitio estático servido por nginx en el VPS.
# 1. Copia la carpeta dist/ a /var/www/llavecorp/dist
# 2. Guarda este archivo en /etc/nginx/sites-available/llavecorp y enlázalo en sites-enabled
# 3. sudo certbot --nginx -d llavecorp.com -d www.llavecorp.com   (agrega los certificados solo)
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  listen [::]:80;
  server_name llavecorp.com www.llavecorp.com;
  return 301 https://llavecorp.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name llavecorp.com;

  # ssl_certificate y ssl_certificate_key los agrega certbot aquí.

  root /var/www/llavecorp/dist;
  index index.html;

  # Rutas limpias: /activa -> /activa/index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Estáticos con hash en el nombre: caché larga.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~* \.(svg|png|webp|jpg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/json;
  add_header X-Content-Type-Options nosniff;
}

# www en HTTPS también redirige al dominio principal.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.llavecorp.com;
  return 301 https://llavecorp.com$request_uri;
}
