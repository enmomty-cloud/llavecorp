# LlaveCorp — sitio estático servido por nginx en el VPS.
# 1. Copia la carpeta dist/ a /var/www/llavecorp/dist
# 2. Guarda este archivo en /etc/nginx/sites-available/llavecorp y enlázalo en sites-enabled
# 3. sudo certbot --nginx -d llavecorp.com -d www.llavecorp.com   (agrega los certificados solo)
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# Seguridad: el sitio no tiene backend ni formularios, así que la política de contenido (CSP)
# solo permite archivos propios, Google Fonts y el hash del único script inline (el del tema).
# Si cambias ese script en src/layouts/Base.astro, recalcula el hash con: node scripts/csp-hash.mjs

map $sent_http_content_type $llavecorp_csp {
  default "";
  ~^text/html "default-src 'self'; script-src 'self' 'sha256-3amhEa7xaGyY0IvU6xG2VKZgmZ7s4iy5jL8fi/Zslis='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
  # Si activas Cloudflare Web Analytics (analitica_token en marca.json), usa esta línea en vez de la anterior:
  # ~^text/html "default-src 'self'; script-src 'self' 'sha256-3amhEa7xaGyY0IvU6xG2VKZgmZ7s4iy5jL8fi/Zslis=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
}

server {
  listen 80;
  listen [::]:80;
  server_name llavecorp.com www.llavecorp.com;
  return 301 https://llavecorp.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name llavecorp.com;

  # ssl_certificate y ssl_certificate_key los agrega certbot aquí.

  root /var/www/llavecorp/dist;
  index index.html;

  # Cabeceras de seguridad (always: también en respuestas 404).
  add_header Content-Security-Policy $llavecorp_csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # Activa HSTS solo cuando HTTPS ya funcione bien (certbot listo). Un año, sin preload.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Nada de archivos ocultos ni fuentes del proyecto.
  location ~ /\. { deny all; }

  # Rutas limpias: /activa -> /activa/index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Estáticos con hash en el nombre: caché larga.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
  location ~* \.(svg|png|webp|jpg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
  }

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml application/json;
  server_tokens off;
}

# www en HTTPS también redirige al dominio principal.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.llavecorp.com;
  return 301 https://llavecorp.com$request_uri;
}
