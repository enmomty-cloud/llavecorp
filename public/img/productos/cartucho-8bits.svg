<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" shape-rendering="crispEdges">
  <defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.4" fill="#1a1433" opacity=".18"/></pattern></defs>
  <rect width="400" height="400" fill="#fbf4dc"/><rect width="400" height="400" fill="url(#h)"/>
  <g transform="translate(100 50)">
    <!-- cuerpo del cartucho alto, estilo 8 bits -->
    <rect x="0" y="0" width="200" height="270" fill="#1a1433"/>
    <rect x="10" y="10" width="180" height="250" fill="#b8b4c4"/>
    <!-- ranuras laterales -->
    <g fill="#1a1433"><rect x="10" y="30" width="14" height="160"/><rect x="176" y="30" width="14" height="160"/></g>
    <!-- etiqueta -->
    <rect x="40" y="36" width="120" height="120" fill="#1a1433"/>
    <rect x="48" y="44" width="104" height="104" fill="#e4342b"/>
    <g fill="#fffaea"><rect x="60" y="60" width="16" height="16"/><rect x="84" y="60" width="16" height="16"/><rect x="108" y="60" width="16" height="16"/><rect x="60" y="92" width="80" height="12"/><rect x="60" y="116" width="48" height="12"/></g>
    <!-- muesca inferior -->
    <rect x="30" y="210" width="140" height="50" fill="#1a1433"/>
    <rect x="40" y="220" width="120" height="30" fill="#8e8a9c"/>
    <!-- argolla -->
    <circle cx="100" cy="-14" r="14" fill="none" stroke="#1a1433" stroke-width="8"/>
  </g>
  <text x="200" y="365" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="12" fill="#1a1433">Tu nombre en la etiqueta</text>
</svg>
