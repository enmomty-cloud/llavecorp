<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" shape-rendering="crispEdges">
  <defs><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.4" fill="#1a1433" opacity=".18"/></pattern></defs>
  <rect width="400" height="400" fill="#fbf4dc"/><rect width="400" height="400" fill="url(#h)"/>
  <g transform="translate(60 80)">
    <!-- cuerpo ancho estilo 16 bits, hombros escalonados -->
    <g fill="#1a1433"><rect x="30" y="0" width="220" height="30"/><rect x="0" y="30" width="280" height="200"/></g>
    <g fill="#b8b4c4"><rect x="40" y="10" width="200" height="30"/><rect x="10" y="40" width="260" height="180"/></g>
    <!-- ranuras -->
    <g fill="#1a1433"><rect x="10" y="60" width="12" height="120"/><rect x="258" y="60" width="12" height="120"/></g>
    <!-- etiqueta -->
    <rect x="50" y="50" width="180" height="110" fill="#1a1433"/>
    <rect x="58" y="58" width="164" height="94" fill="#19c3d6"/>
    <g fill="#1a1433"><rect x="72" y="72" width="60" height="14"/><rect x="72" y="96" width="120" height="14"/><rect x="72" y="120" width="88" height="14"/></g>
    <g fill="#ff2e88"><rect x="180" y="68" width="30" height="30"/></g>
    <!-- muesca inferior -->
    <rect x="30" y="180" width="220" height="40" fill="#1a1433"/>
    <rect x="40" y="190" width="200" height="20" fill="#8e8a9c"/>
    <!-- argolla -->
    <circle cx="140" cy="-12" r="14" fill="none" stroke="#1a1433" stroke-width="8"/>
  </g>
  <text x="200" y="365" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="12" fill="#1a1433">Tu nombre en la etiqueta</text>
</svg>
