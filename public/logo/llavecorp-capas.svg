<?xml version="1.0" encoding="UTF-8"?>
<!--
  LlaveCorp — emblema para imprimir en 3D como llavero (versión 2, a partir de las propuestas de IA).
  Rejilla de 6 unidades; ninguna forma mide menos de 12 unidades (2.25 mm a 45 mm de ancho).
  Capas (una por color de filamento):
    capa-fondo    -> color base (índigo). Es la pieza completa: extruir 3 a 4 mm.
    capa-acento   -> mitad derecha (magenta). Extruir 0.6 a 1 mm sobre el fondo.
    capa-relieve  -> llave y barras de señal (crema). Extruir 0.6 a 1 mm sobre lo anterior.
                     El ojo de la llave (x 36..48, y 36..60) es un hueco: ahí se ve el fondo.
    capa-argolla  -> marca del barreno para la argolla (extremo opuesto al chip). Es un hueco, no un relieve.
  El chip NFC (etiqueta redonda de 25 mm) va en una cavidad por la parte trasera, centrada bajo la mitad derecha.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" width="45mm" height="18mm" shape-rendering="crispEdges">
  <g id="capa-fondo" fill="#1a1433">
    <rect x="0" y="0" width="240" height="96" rx="48"/>
  </g>
  <g id="capa-acento" fill="#e4342b">
    <path d="M120 0 H192 A48 48 0 0 1 192 96 H120 Z"/>
  </g>
  <g id="capa-relieve" fill="#fffaea">
    <!-- llave pixel: cabeza escalonada con ojo vertical, vástago grueso y dos dientes -->
    <rect x="36" y="24" width="24" height="12"/>
    <rect x="24" y="36" width="12" height="24"/>
    <rect x="48" y="36" width="24" height="24"/>
    <rect x="36" y="60" width="24" height="12"/>
    <rect x="72" y="40" width="42" height="16"/>
    <rect x="78" y="56" width="12" height="12"/>
    <rect x="102" y="56" width="12" height="12"/>
    <!-- barras de señal NFC, alineadas abajo -->
    <rect x="150" y="52" width="14" height="20"/>
    <rect x="174" y="36" width="14" height="36"/>
    <rect x="198" y="20" width="14" height="52"/>
  </g>
  <g id="capa-argolla" fill="none" stroke="#ffd23f" stroke-width="2">
    <circle cx="14" cy="48" r="6"/>
  </g>
</svg>
